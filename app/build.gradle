plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.halcyon2026928.freewindow'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.halcyon2026928.freewindow"
        minSdk 21
        // targetSdk 必须 < 33：Android 13+ 对 targetSdk>=33 的应用禁止写 Settings.System
        //（enforceRestrictedSystemSettingsMutationForCallingPackage 抛 SecurityException），
        // 降到 32 仅警告、放行写入；模块为 Xposed 用途，不受 targetSdk 影响。
        targetSdk 32
        versionCode 23
        versionName "3.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            pseudoLocalesEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.outputs.forEach { output ->
                output.outputFileName.set("freewindow-${variant.buildType}.apk")
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
}
